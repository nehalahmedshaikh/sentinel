name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install project dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Run database migrations
        run: SENTINEL_DATABASE_URL="$SENTINEL_TEST_DATABASE_URL" uv run alembic upgrade head

      - name: Test
        run: uv run pytest --cov=sentinel --cov-report=term-missing
