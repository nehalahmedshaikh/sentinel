{% if jobs %}<table><tr><th>Job</th><th>Type</th><th>Status</th><th>Created</th><th>Attempts</th><th>Details</th></tr>{% for job in jobs %}<tr><td><a href="/dashboard/jobs/{{ job.id }}">{{ job.id }}</a></td><td>{{ job.job_type }}</td><td class="status {{ job.status }}">{{ job.status }}</td><td>{{ job.created_at }}</td><td>{{ job.attempt_count }}</td><td>{{ job.error_message or job.progress }}</td></tr>{% endfor %}</table>{% else %}<p class="empty">No job activity yet.</p>{% endif %}
